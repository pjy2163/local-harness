# Project-scoped Codex configuration.
# Loaded only when this repository is trusted.

# Luna-main is the sole implementation/test write owner for LOW/MEDIUM
# contracts, focused verification, fixes, and the handoff to read-only Sol roles.
model = "gpt-5.6-luna"
model_reasoning_effort = "max"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
auth = "oauth"
# Optional; enable only after docs/NOTION.local.md has a verified target.
enabled = false
required = false
default_tools_approval_mode = "writes"
