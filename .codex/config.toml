# Project-scoped Codex configuration.
# Loaded only when this repository is trusted.

# Terra-main owns LOW/MEDIUM contracts, implementation, focused verification,
# final regression, and the handoff to the read-only Sol roles.
model = "gpt-5.6-terra"
model_reasoning_effort = "max"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "max"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
auth = "oauth"
enabled = true
required = false
default_tools_approval_mode = "writes"
