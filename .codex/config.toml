# Project-scoped Codex configuration.
# Loaded only when this repository is trusted.

# The primary thread owns problem framing, scope, planning, decisions,
# integration review, and final accountability.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true

[agents.implementer]
description = "Implement owner-approved code, UI, configuration, and tests without making product or architecture decisions."
config_file = "./agents/implementer.toml"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
auth = "oauth"
enabled = true
required = false
default_tools_approval_mode = "writes"
